name: Contract checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-method-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline lab dependencies
        run: python -m pip install -r requirements.txt
      - name: Run contract unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic case
        run: python -m scripts.validate_examples examples/fintrust_discovery.json
      - name: Run M2 offline evaluation and critical checks
        run: python -m evals.run --output evals/runs/ci.json
